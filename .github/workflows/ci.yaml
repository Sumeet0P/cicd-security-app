name: CI Pipeline

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ./app
        run: npm install

      - name: Run Snyk to check vulnerabilities
        uses: snyk/actions/node@master
        with:
          command: test
          args: --file=app/package.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Scan for secrets using Gitleaks
        uses: gitleaks/gitleaks-action@v2

      - name: Build Docker image
        run: docker build --no-cache -t cicd-security-app .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: cicd-security-app
          format: table
          severity: CRITICAL

      - name: Run container
        run: docker run -d -p 3000:3000 cicd-security-app

      - name: Wait for app
        run: sleep 5

      - name: List containers
        run: docker ps -a

      - name: Show container logs
        run: docker logs $(docker ps -q)

      - name: Check app
        run: curl http://localhost:3000

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cicd-security-app .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/cicd-security-app

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var="docker_image=${{ secrets.DOCKERHUB_USERNAME }}/cicd-security-app"

      - name: Wait for EC2
        run: sleep 60

      - name: Get EC2 Public IP
        working-directory: terraform
        run: terraform output public_ip